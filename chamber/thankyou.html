<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">

  <title>Thank You | Rio Chamber</title>
  <link rel="icon" href="images/logo.avif">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/thankyou.css">
  <script src="scripts/thankyou.js" defer></script>

<body>
  <header>
    <span class="site-name">Rio Chamber of Commerce</span>

  <nav class="navigation">

  <main class="thankyou-main">
    <h1>Thank You for Joining!</h1>
    <p>We're excited to welcome you to the Rio Chamber of Commerce.</p>

    <ul>
      <li><strong>First Name:</strong> <span id="firstName"></span></li>

  </main>

  <footer>
    <p>&copy; <span id="year"></span> | Felipe Zardo | WDD 231</p>
    <p id="lastModified"></p>

    document.getElementById("lastModified").textContent = `Last Modified: ${document.lastModified}`;
