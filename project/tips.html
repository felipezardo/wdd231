<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="Daggerheart Cards Manager" />
  <meta name="description" content="Manage your Daggerheart cards with ease. Build your deck, explore domains, and prepare for your next adventure." />
<meta name="author" content="Felipe Zardo" />

<meta property="og:description" content="A tool to manage your Daggerheart cards and character loadouts." />
<meta property="og:image" content="https://felipezardo.github.io/wdd231/project/images/hero.avif" />
<meta property="og:url" content="https://felipezardo.github.io/wdd231/project/" />
  <title>Send a Tip | Daggerheart Cards Manager</title>

  <link rel="stylesheet" href="styles/tips.css" />
  <link rel="stylesheet" href="styles/tips-large.css" media="screen and (min-width: 768px)" />
  <link href="https://fonts.googleapis.com/css2?family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">
  <link rel="icon" href="images/logo.png" type="image/png" />
</head>

<body>
  <header>
    <div class="branding">
      <img src="images/logo.png" alt="Daggerheart logo" class="logo" />
      <h3>Daggerheart Cards Manager</h3>
    </div>
    <nav>
      <button id="menu-toggle" aria-label="Toggle menu">☰</button>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="cards.html">Cards</a></li>
        <li><a href="tips.html" class="active">Send a Tip</a></li>
      </ul>
    </nav>
  </header>

  <div class="breadcrumbs">
    <a href="index.html">Home ></a> <span>Send a Tip</span>
  </div>
  <main>
    <section class="intro">
      <div class="text">
        <h1>Send a Tip</h1>
        <p>Build your card</p>
        <form>
          <label for="card-type">Card Type</label>
          <select id="card-type" name="card-type" required>
            <option value="">Select a type</option>
            <option value="class">Class</option>
            <option value="sub-class">Sub-class</option>
            <option value="domain">Domain</option>
            <option value="community">Community</option>
            <option value="ancestry">Ancestry</option>
          </select>

          <label for="description">Card Description</label>
          <textarea id="description" name="description" rows="6" required></textarea>

          <button type="submit" class="cta-button">SUBMIT</button>
        </form>
      </div>
    </section>
    <div id="toast" class="toast hidden">✅ Tip sent successfully!</div>

  </main>

  <footer>
    <p>© 2025 Felipe Zardo — Project for WDD231</p>
  </footer>

  <script src="scripts/tips.js"></script>
</body>

</html>
