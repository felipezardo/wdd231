<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="Daggerheart Cards Manager" />
  <meta name="description"
    content="Manage your Daggerheart cards with ease. Build your deck, explore domains, and prepare for your next adventure." />
  <meta name="author" content="Felipe Zardo" />

  <meta property="og:description" content="A tool to manage your Daggerheart cards and character loadouts." />
  <meta property="og:image" content="https://felipezardo.github.io/wdd231/project/images/hero.avif" />
  <meta property="og:url" content="https://felipezardo.github.io/wdd231/project/" />
  <title>Cards | Daggerheart Cards Manager</title>
  <link rel="stylesheet" href="styles/cards.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">

  <link rel="icon" href="images/logo.png" type="image/png" />
</head>

<body>
  <header>
    <div class="branding">
      <img src="images/logo.png" alt="Daggerheart logo" class="logo" loading="lazy" />
      <h3>Daggerheart Cards Manager</h3>
    </div>
    <nav>
      <button id="menu-toggle" aria-label="Toggle menu">☰</button>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="cards.html" class="active">Cards</a></li>
        <li><a href="tips.html">Send a Tip</a></li>
      </ul>
    </nav>
  </header>

  <div class="breadcrumbs">
    <a href="index.html">Home ></a> <span>Cards</span>
  </div>

  <main>
    <!-- Cards -->
    <h1>Cards</h1>
    <button id="toggleCartas" class="cartas-toggle">
      <span class="seta">&#9654;</span> Cards
    </button>
    <section id="cartasPanel" class="cartas-panel retraido">
      <div class="cartas-controls">
        <input type="text" id="searchInput" placeholder="Search card..." />
        <div class="filtros">
          <div id="dominioFiltros" class="checkbox-group"></div>
        </div>
        <button id="limparFiltros" class="limpar-btn">Clear Filters</button>
      </div>

      <div class="cartas-conteudo">
        <div id="listaCartas" class="lista-cartas"></div>

        <!-- Card viewer inside cards panel -->
        <div id="visualizadorCarta" class="visualizador ">
          <img id="cartaImg" src="images/placeholder.png" alt="Card" loading="lazy" />
          <button id="adicionarBtn" class="adicionar-btn">Add</button>
        </div>
      </div>
    </section>

    <!-- Active -->
    <button id="toggleAtivas" class="cartas-toggle">
      <span class="seta">&#9654;</span> Active
    </button>
    <section id="ativasPanel" class="cartas-panel retraido">
      <div id="ativasConteudo" class="cartas-conteudo"></div>
    </section>

    <!-- Vault -->
    <button id="toggleVault" class="cartas-toggle">
      <span class="seta">&#9654;</span> Vault
    </button>
    <section id="vaultPanel" class="cartas-panel retraido">
      <div id="vaultConteudo" class="cartas-conteudo"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Felipe Zardo | Project for WDD231.</p>

  </footer>

  <script src="scripts/cards.js"></script>

</body>

</html>
